<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubam Mittal Store - Invoice Generator</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 900px; margin: 10px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        #installBtn { 
            display: none; 
            width: 100%; 
            background: #3498db; 
            color: white; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: none;
            border-radius: 8px; 
            font-size: 14px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 15px; }
        .shop-title { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .date-display { font-size: 16px; font-weight: bold; color: #7f8c8d; }

        .type-toggle-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 12px; border: 2px solid #3498db; background: white; color: #3498db; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .type-btn.active { background: #3498db; color: white; }

        .header-inputs { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .header-inputs div { display: flex; flex-direction: column; width: 100%; }
        
        .item-entry { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; padding: 20px; background: #e9ecef; border-radius: 10px; }
        
        input, select { padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; outline: none; transition: border 0.3s; background: white; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #574956; text-transform: uppercase; }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 15px; background-color: #3498db; color: white; }
        td { padding: 15px; border-bottom: 1px solid #dee2e6; }

        .payment-section { background: #f1f3f5; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 8px; }
        .status-btn { flex: 1; padding: 12px; border: 2px solid #27ae60; background: white; color: #27ae60; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .status-btn.active { background: #27ae60; color: white; }
        .credit-details { display: none; margin-top: 15px; grid-template-columns: 1fr 1fr; gap: 15px; }

        .footer-container { display: flex; flex-direction: column; align-items: flex-end; margin-top: 20px; border-top: 2px solid #3498db; padding-top: 20px; }
        .grand-total { font-size: 18px; font-weight: 800; color: #2c3e50; background: #fff3cd; padding: 10px 20px; border-radius: 8px; }
        
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .add-btn { background: #27ae60; color: white; padding: 14px 25px; width: 100%; }
        .edit-btn { background: #f39c12; color: white; padding: 6px 10px; margin-right: 5px; }
        .delete-btn { background: #e74c3c; color: white; padding: 6px 10px; }
        .generate-btn { width: 100%; background: #27ae60; color: white; padding: 18px; font-size: 18px; margin-top: 20px; }

        @media (min-width: 768px) {
            body { padding: 40px; }
            .header-inputs { flex-direction: row; justify-content: space-between; }
            .header-inputs div { width: 48%; }
            .item-entry { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
            .add-btn { width: auto; }
            #installBtn { width: auto; position: absolute; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

<button id="installBtn">📲 INSTALL APP</button>

<div class="container">
    <div class="header-bar">
        <div class="shop-title">Shubam Mittal Store</div>
        <div class="date-display" id="formattedDate"></div>
    </div>

    <!-- Transaction Type Toggle Buttons -->
    <div class="type-toggle-container">
        <button type="button" class="type-btn active" id="btnSales" onclick="setTransactionType('Sales')">SALES</button>
        <button type="button" class="type-btn" id="btnPurchase" onclick="setTransactionType('Purchase')">PURCHASE</button>
    </div>

    <div class="header-inputs">
        
        <div>
            <label>Creditor *</label>
            <select id="creditorSelect" onchange="toggleCustomCreditor()">
                <option value="Abhishek">Abhishek</option>
                <option value="Arun">Arun</option>
                <option value="Aman">Aman</option>
                <option value="Ashish">Ashish</option>
                <option value="other">Other (Custom)</option>
            </select>
            <input type="text" id="customCreditorInput" placeholder="Enter custom creditor name" style="display: none; margin-top: 10px;">
        </div>
    </div>

    <div class="item-entry">
        <div><label>Item Name</label><input type="text" id="itemName" placeholder="Product Description"></div>
        <div><label>Price (₹)</label><input type="number" id="itemPrice" step="0.01" placeholder="0.00"></div>
        <div><label>Qty</label><input type="number" id="itemQty" step="0.01" value="1"></div>
        <button class="add-btn" id="addOrUpdateBtn" onclick="addOrUpdateItem()">ADD ITEM</button>
    </div>

    <div class="table-responsive">
        <table id="itemTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer-container">
        <div class="grand-total" id="grandTotalDisplay">TOTAL: ₹0.00</div>
    </div>

    <!-- Payment Status Buttons -->
    <div class="payment-section">
        <label>Payment Status</label>
        <div class="payment-buttons">
            <button type="button" class="status-btn active" id="btnFullPayment" onclick="setPaymentStatus('full')">Full Payment</button>
            <button type="button" class="status-btn" id="btnCredit" onclick="setPaymentStatus('credit')">Credit</button>
        </div>
        <div class="credit-details" id="creditDetails">
            <div>
                <label>Part Payment (₹)</label>
                <input type="number" id="partPayment" step="0.01" value="0" oninput="calculateBalance()">
            </div>
            <div>
                <label>Balance Amount (₹)</label>
                <input type="number" id="balanceAmount" readonly value="0.00">
            </div>
        </div>
    </div>

    <button class="generate-btn" onclick="postToGoogleSheet()">POST TO GOOGLE SHEETS</button>
</div>

<script>
    let items = [];
    let editingItemId = null;
    let selectedTransactionType = "Sales";
    let selectedPaymentStatus = "full";

    // Set Today's Date in DD/MM/YYYY format
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    const formattedDateStr = `${day}/${month}/${year}`;
    document.getElementById('formattedDate').innerText = `Date: ${formattedDateStr}`;

    const currencyFormatter = new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

    function setTransactionType(type) {
        selectedTransactionType = type;
        document.getElementById('btnSales').classList.toggle('active', type === 'Sales');
        document.getElementById('btnPurchase').classList.toggle('active', type === 'Purchase');
    }

    function setPaymentStatus(status) {
        selectedPaymentStatus = status;
        document.getElementById('btnFullPayment').classList.toggle('active', status === 'full');
        document.getElementById('btnCredit').classList.toggle('active', status === 'credit');
        document.getElementById('creditDetails').style.display = status === 'credit' ? 'grid' : 'none';
        calculateBalance();
    }

    function toggleCustomCreditor() {
        const select = document.getElementById('creditorSelect');
        const customInput = document.getElementById('customCreditorInput');
        customInput.style.display = select.value === 'other' ? 'block' : 'none';
    }

    function addOrUpdateItem() {
        const name = document.getElementById('itemName').value;
        const price = parseFloat(document.getElementById('itemPrice').value);
        const qty = parseFloat(document.getElementById('itemQty').value); 

        if (!name || isNaN(price) || isNaN(qty)) {
            alert("Please fill item details correctly.");
            return;
        }

        if (editingItemId !== null) {
            items = items.map(item => item.id === editingItemId ? { id: item.id, name, price, qty, total: price * qty } : item);
            editingItemId = null;
            document.getElementById('addOrUpdateBtn').innerText = 'ADD ITEM';
        } else {
            items.push({ id: Date.now(), name, price, qty, total: price * qty });
        }

        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemQty').value = '1';
        render();
    }

    function editItem(id) {
        const item = items.find(i => i.id === id);
        if (item) {
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemQty').value = item.qty;
            editingItemId = id;
            document.getElementById('addOrUpdateBtn').innerText = 'UPDATE ITEM';
        }
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        if (editingItemId === id) {
            editingItemId = null;
            document.getElementById('addOrUpdateBtn').innerText = 'ADD ITEM';
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemQty').value = '1';
        }
        render();
    }

    function getTotal() {
        return items.reduce((sum, item) => sum + item.total, 0);
    }

    function render() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let itemSum = 0;

        items.forEach((item, index) => {
            itemSum += item.total;
            tbody.innerHTML += `<tr>
                <td>${index + 1}</td>
                <td>${item.name}</td>
                <td>₹${currencyFormatter.format(item.price)}</td>
                <td>${item.qty}</td>
                <td>₹${currencyFormatter.format(item.total)}</td>
                <td>
                    <button class="edit-btn" onclick="editItem(${item.id})">Edit</button>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">×</button>
                </td>
            </tr>`;
        });

        document.getElementById('grandTotalDisplay').innerText = `TOTAL: ₹${currencyFormatter.format(itemSum)}`;
        calculateBalance();
    }

    function calculateBalance() {
        const grandTotal = getTotal();
        if (selectedPaymentStatus === 'credit') {
            const partPay = parseFloat(document.getElementById('partPayment').value) || 0;
            const balance = grandTotal - partPay;
            document.getElementById('balanceAmount').value = balance >= 0 ? balance.toFixed(2) : '0.00';
        }
    }

    function postToGoogleSheet() {
        const customer = document.getElementById('customerName').value.trim();
        const creditorSelect = document.getElementById('creditorSelect').value;
        const customCreditor = document.getElementById('customCreditorInput').value.trim();
        const creditor = creditorSelect === 'other' ? customCreditor : creditorSelect;

        if (!customer) {
            alert("Customer Name is required.");
            return;
        }
        if (!creditor) {
            alert("Please select or enter a Creditor name.");
            return;
        }
        if (items.length === 0) {
            alert("Please add at least one item.");
            return;
        }

        const grandTotal = getTotal();
        let partPayment = 0;
        let balance = 0;

        if (selectedPaymentStatus === 'credit') {
            partPayment = parseFloat(document.getElementById('partPayment').value) || 0;
            balance = grandTotal - partPayment;
        } else {
            partPayment = grandTotal;
        }

        const itemsString = items.map(i => `${i.name} (Qty: ${i.qty}, Price: ${i.price})`).join(", ");

        const payload = {
            shopName: "Shubam Mittal Store",
            transactionType: selectedTransactionType,
            date: formattedDateStr,
            customerName: customer,
            creditor: creditor,
            items: itemsString,
            totalAmount: grandTotal,
            paymentStatus: selectedPaymentStatus.toUpperCase(),
            partPayment: partPayment,
            balanceAmount: balance
        };

        fetch('https://script.google.com/macros/s/AKfycbxk3SIA47OPgYEEyxJvcXI8Mz6pz7s4REbLYrUDM4pYMhqH7EUIE4IP0qcjUIU74zHf/exec', {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Details posted successfully to Google Sheet!");
        }).catch(err => {
            console.error(err);
            alert("Error posting details to Google Sheet.");
        });
    }
</script>
</body>
</html>
